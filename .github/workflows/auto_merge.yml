name: Dev Delivery Logic

# Trigger execution when code is pushed to 'dev'
on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create PR and Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Check if a PR already exists from dev -> main
          PR_EXISTS=$(gh pr list --base main --head dev --json number --jq 'length')

          if [ "$PR_EXISTS" -eq 0 ]; then
            echo "🚀 No PR found. Creating one..."
            
            # Create the PR with Copilot as the reviewer
            PR_URL=$(gh pr create \
              --base main \
              --head dev \
              --title "Auto-Deploy: Merge Dev to Main" \
              --body "Automated PR triggered by push to dev branch. Validating changes..." \
              --reviewer copilot)
              
            echo "✅ PR Created: $PR_URL"
            
            # 2. Enable Auto-Merge
            # REMOVED '--delete-branch' to preserve 'dev'
            gh pr merge "$PR_URL" --auto --merge
            echo "✅ Auto-Merge Enabled (Dev branch will remain)."
            
          else
            echo "ℹ️ PR already exists. Ensuring settings are correct..."
            
            # Get the existing PR URL
            PR_URL=$(gh pr list --base main --head dev --json url --jq '.[0].url')
            
            # Ensure Copilot is requested (in case it was missed)
            gh pr edit "$PR_URL" --add-reviewer copilot
            
            # Ensure auto-merge is on (without deleting branch)
            gh pr merge "$PR_URL" --auto --merge
          fi