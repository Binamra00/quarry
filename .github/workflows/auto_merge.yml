name: Dev Delivery Logic

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ====================================================
  # JOB 1: LOGISTICS - OPEN THE PR
  # ====================================================
  infrastructure_pr:
    name: 1. Open Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create or Identify PR
        id: pr_logic
        env:
          # Keep this! This makes the PR "Human" so Copilot reviews it.
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          # Check for existing PR
          PR_EXISTS=$(gh pr list --base main --head dev --json number --jq 'length')

          if [ "$PR_EXISTS" -eq 0 ]; then
            COMMIT_MSG=$(git log -1 --pretty=%s)
            echo "🚀 Creating PR: $COMMIT_MSG"
            gh pr create \
              --base main \
              --head dev \
              --title "$COMMIT_MSG" \
              --body "Automated delivery pipeline."
          else
            echo "ℹ️ PR already exists."
          fi

  # DELETE JOB 2 (trigger_review) - It is no longer needed!