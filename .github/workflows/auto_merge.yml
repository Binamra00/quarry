name: Dev Delivery Logic

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create PR, Trigger Bot, and Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --base main --head dev --json number --jq 'length')

          if [ "$PR_EXISTS" -eq 0 ]; then
            # 1. Capture Title
            COMMIT_MSG=$(git log -1 --pretty=%s)
            
            # 2. Create PR
            echo "🚀 Creating PR..."
            PR_URL=$(gh pr create \
              --base main \
              --head dev \
              --title "$COMMIT_MSG" \
              --body "Automated delivery pipeline.")
              
            echo "✅ PR Created: $PR_URL"
            
            echo "⏳ Waiting 10s for stabilization..."
            sleep 10

            # 3. TRIGGER BOT (Moved here!)
            # We explicitly comment to wake up Copilot
            gh pr comment "$PR_URL" --body "ci/review"
            echo "🤖 Copilot triggered."
            
            # 4. Enable Auto-Merge
            gh pr merge "$PR_URL" --auto --merge
            echo "✅ Auto-Merge Enabled."
            
          else
            echo "ℹ️ PR exists. Ensuring state..."
            PR_URL=$(gh pr list --base main --head dev --json url --jq '.[0].url')
            
            # Ensure trigger and merge are active
            gh pr comment "$PR_URL" --body "ci/review"
            gh pr merge "$PR_URL" --auto --merge
          fi