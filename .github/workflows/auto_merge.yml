name: Dev Delivery Logic

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ====================================================
  # JOB 1: LOGISTICS - OPEN THE PR
  # ====================================================
  infrastructure_pr:
    name: 1. Open Pull Request
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.pr_logic.outputs.url }} # Expose URL to other job
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create or Identify PR
        id: pr_logic
        env:
          # CRITICAL CHANGE: Use the PAT so the PR appears as "User-created"
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          # Check for existing PR
          PR_EXISTS=$(gh pr list --base main --head dev --json number --jq 'length')
          PR_URL=""

          if [ "$PR_EXISTS" -eq 0 ]; then
            # Capture Title from git history
            COMMIT_MSG=$(git log -1 --pretty=%s)
            
            echo "🚀 Creating PR: $COMMIT_MSG"
            PR_URL=$(gh pr create \
              --base main \
              --head dev \
              --title "$COMMIT_MSG" \
              --body "Automated delivery pipeline.")
          else
            echo "ℹ️ PR exists. Fetching URL..."
            PR_URL=$(gh pr list --base main --head dev --json url --jq '.[0].url')
          fi

          echo "✅ Target PR: $PR_URL"
          
          # MAGIC: Write the URL to the GitHub Output buffer so Job 2 can see it
          echo "url=$PR_URL" >> $GITHUB_OUTPUT

  # ====================================================
  # JOB 2: QUALITY - TRIGGER REVIEW
  # ====================================================
  trigger_review:
    name: 2. Execute Review
    needs: infrastructure_pr # Waits for Job 1
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot Reviewer
        env:
          # CRITICAL CHANGE: Use PAT to have permission to assign reviewers
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          PR_URL="${{ needs.infrastructure_pr.outputs.pr_url }}"
          echo "🤖 Force-assigning Copilot to: $PR_URL"
          
          # Force the reviewer assignment using the official handle
          gh pr edit "$PR_URL" --add-reviewer "github-copilot"
          
          # Optional: Add a tiny sleep to ensure comment propagates
          sleep 5