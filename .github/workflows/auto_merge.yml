name: Dev Delivery Logic

# Trigger execution when code is pushed to 'dev'
on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # <--- CRITICAL FIX: Downloads full history so 'gh' can compare branches

      - name: Create PR and Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Check if a PR already exists from dev -> main
          PR_EXISTS=$(gh pr list --base main --head dev --json number --jq 'length')

          if [ "$PR_EXISTS" -eq 0 ]; then
            echo "🚀 No PR found. Creating one..."
            
            # Create the PR with dynamic title/body from commits
            # --fill uses the commit info. This requires the history we just fetched.
            PR_URL=$(gh pr create \
              --base main \
              --head dev \
              --fill \
              --reviewer copilot)
              
            echo "✅ PR Created: $PR_URL"
            
            # 2. Enable Auto-Merge immediately
            gh pr merge "$PR_URL" --auto --merge
            echo "✅ Auto-Merge Enabled."
            
          else
            echo "ℹ️ PR already exists. Ensuring settings are correct..."
            
            # Get the existing PR URL
            PR_URL=$(gh pr list --base main --head dev --json url --jq '.[0].url')
            
            # Ensure Copilot is requested
            gh pr edit "$PR_URL" --add-reviewer copilot
            
            # Ensure auto-merge is on
            gh pr merge "$PR_URL" --auto --merge
          fi