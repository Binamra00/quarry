name: Dev Delivery Logic

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create PR and Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --base main --head dev --json number --jq 'length')

          if [ "$PR_EXISTS" -eq 0 ]; then
            # 1. Capture the Commit Message for the Title
            COMMIT_MSG=$(git log -1 --pretty=%s)
            
            echo "🚀 Creating PR with title: $COMMIT_MSG"
            
            # 2. Create PR with explicit title
            PR_URL=$(gh pr create \
              --base main \
              --head dev \
              --title "$COMMIT_MSG" \
              --body "Automated delivery pipeline.")
              
            echo "✅ PR Created: $PR_URL"
            
            echo "⏳ Waiting 10s for PR stabilization..."
            sleep 10
            
            # 3. Enable Auto-Merge
            gh pr merge "$PR_URL" --auto --merge
            echo "✅ Auto-Merge Enabled."
            
          else
            echo "ℹ️ PR exists. Ensuring auto-merge..."
            PR_URL=$(gh pr list --base main --head dev --json url --jq '.[0].url')
            gh pr merge "$PR_URL" --auto --merge
          fi