name: Smell-Ranker CI

# Trigger execution on:
# 1. Any push to 'main' or 'dev' branches
# 2. Any Pull Request targeting 'main'
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

# Define the jobs to run
jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code from the repository
    - uses: actions/checkout@v3

    # 2. Install Python 3.10 (Matching your Colab environment)
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # 3. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Explicitly install testing tools
        pip install pytest pytest-mock

    # 4. Run the Tests
    # This executes your BVA and Unit tests
    - name: Run Test Suite
      run: |
        # The -v flag gives verbose output so you see exactly which tests passed
        pytest tests/ -v